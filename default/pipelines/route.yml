id: default
groups: {}
comments: []
routes:
  - id: cribl_internal_metrics
    name: Cribl Internal Metrics
    final: true
    disabled: false
    pipeline: cribl_metrics_to_splunk
    description: Process CriblMetrics input events.
    enableOutputExpression: false
    targetContext: group
    filter: "__inputId=='CriblMetrics'"
    clones: []
    output: __group
  - id: cribl_internal_logs
    name: Cribl Internal Logs
    final: true
    disabled: false
    pipeline: cribl_internal
    description: Process CriblLogs input events.
    enableOutputExpression: false
    targetContext: group
    filter: "__inputId=='CriblLogs'"
    clones: []
    output: __group
